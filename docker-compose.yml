services:
  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: demo
    working_dir: /work
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      FRACTALSQL_HTTP_URL: http://ollama:11434/v1/chat/completions
      FRACTALSQL_HTTP_ALLOW_PLAINTEXT: "on"
      FRACTALSQL_HTTP_MODEL: gpt-oss:20b
      FRACTALSQL_HTTP_EMBED_URL: http://ollama:11434/v1/embeddings
      FRACTALSQL_HTTP_EMBED_MODEL: nomic-embed-text
      FSQL_REASONING_HTTP_TIMEOUT_MS: "330000"
      FSQL_REASONING_HTTP_LOW_SPEED_SECS: "300"
    volumes:
      - demo_data:/work
    command: ["sleep", "infinity"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  pull-model:
    image: ollama/ollama:latest
    profiles: ["pull-model"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull gpt-oss:20b && ollama pull nomic-embed-text"]

volumes:
  demo_data:
  ollama_data: